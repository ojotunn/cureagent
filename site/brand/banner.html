<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ehrlich — X banner</title>
<style>
  /* Banner do X: 1500x500 exatos. Renderizado com Chrome headless,
     a proteina e a estrutura REAL do projeto, nao arte generica. */
  :root{
    --paper:#fbfbfa; --card:#fff; --line:#e4e6e4; --line2:#f0f1ef;
    --ink:#16191c; --ink2:#3d4348; --dim:#767d84; --accent:#0e7c6b;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1500px;height:500px;overflow:hidden;
    background-color:var(--paper);
    background-image:linear-gradient(var(--line2) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line2) 1px,transparent 1px);
    background-size:34px 34px;
    font-family:var(--sans);color:var(--ink);position:relative}

  .grid{display:grid;grid-template-columns:1fr 520px;height:100%;align-items:center}

  .left{padding:0 0 96px 88px}  /* folga para o avatar do X, que sobrepoe o canto inferior esquerdo */
  h1{font-size:104px;letter-spacing:-.045em;font-weight:660;line-height:.95}
  .sub{font-family:var(--mono);color:var(--accent);font-size:20px;margin-top:20px;
    letter-spacing:-.01em}
  .nums{display:flex;gap:44px;margin-top:40px}
  .nums div b{display:block;font-family:var(--mono);font-size:26px;font-weight:620;
    letter-spacing:-.02em}
  .nums div span{display:block;font-size:11.5px;color:var(--dim);margin-top:5px;
    text-transform:uppercase;letter-spacing:.11em}

  .right{position:relative;height:100%;display:flex;align-items:center;
    justify-content:center}
  #v{width:470px;height:470px;position:relative}

  /* marca d'agua do composto 606, discreta */
  .six{position:absolute;right:54px;bottom:26px;font-family:var(--mono);
    font-size:12px;color:var(--dim);letter-spacing:.14em;opacity:.75}
  .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
</style>
</head>
<body>
<div class="edge"></div>
<div class="grid">
  <div class="left">
    <h1>Ehrlich</h1>
    <div class="sub">Open computational screening for neglected diseases</div>
    <div class="nums">
      <div><b id="n1">—</b><span>molecules docked</span></div>
      <div><b id="n2">—</b><span>every run published</span></div>
      <div><b>ehrlich.bio</b><span>open data</span></div>
    </div>
  </div>
  <div class="right"><div id="v"></div></div>
</div>
<div class="six">COMPOUND 606 · 1909</div>

<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script>
fetch("../data/dados.json").then(r => r.json()).then(d => {
  const n = (d.triagem || {}).moleculas_triadas;
  document.getElementById("n1").textContent = n ? n.toLocaleString("en-US") : "—";
  const p = (d.validacao || {}).pose || [];
  const c = (d.validacao || {}).controle_positivo || [];
  document.getElementById("n2").textContent = (p.length + c.length) + " runs";
}).catch(() => {});

fetch("../data/receptor.pdb").then(r => r.text()).then(rec => {
  const view = $3Dmol.createViewer(document.getElementById("v"),
                                   {backgroundColor: "#fbfbfa"});
  view.addModel(rec, "pdb");
  view.setStyle({}, {cartoon: {color: "#7d8a96", opacity: 0.96}});
  return fetch("../data/site_ref.pdb").then(r => r.text()).then(lig => {
    view.addModel(lig, "pdb");
    view.setStyle({model: 1}, {stick: {radius: 0.3, color: "#c2410c"}});
    view.addStyle({model: 0, within: {distance: 8, sel: {model: 1}}},
                  {stick: {radius: 0.13, color: "#0e7c6b"}});
    view.zoomTo({model: 0});
    view.zoom(1.25);
    view.rotate(20, "y");
    view.render();
  });
}).catch(e => { document.getElementById("v").textContent = "estrutura nao carregou: " + e; });
</script>
</body>
</html>
